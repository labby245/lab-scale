name: labscale
description: "LabScale — upscale AI dan boost 60 FPS untuk foto & video, diproses lokal."
publish_to: 'none'
version: 2.2.1+6

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # Drag & drop of files and folders onto the window.
  desktop_drop: ^0.6.0
  # Native open-file / open-folder dialogs.
  file_selector: ^1.0.3
  # Cross-platform path joining for the temp/output folders.
  path: ^1.9.1
  # Resolves the per-user documents folder used for outputs.
  path_provider: ^2.1.5
  # Persists the user's operation preferences between launches.
  shared_preferences: ^2.5.3
  # Video preview with playback controls (libmpv, Windows + macOS).
  media_kit: ^1.2.0
  media_kit_video: ^1.3.0
  media_kit_libs_video: ^1.0.6
  # Verifies downloaded model weights against their pinned sha256.
  crypto: ^3.0.7
  # The running version, for the About dialog and the update check.
  package_info_plus: ^10.2.2
  # Opens the release page, source code and licence links in the browser.
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    # Shown on the in-app licences page (lib/main.dart).
    - THIRD_PARTY_NOTICES.md
